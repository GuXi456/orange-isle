<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>橘子洲 · 沁园春 · 长沙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-snap-type: y mandatory; }
  body { background: #0a0a0a; color: #fff; overflow-x: hidden; }

  .font-mao { font-family: 'KaiTi', 'STKaiti', 'FangSong', cursive; }
  .font-xingshu { font-family: 'KaiTi', 'STKaiti', 'FangSong', serif; }
  .font-sans { font-family: 'Microsoft YaHei', 'SimHei', sans-serif; }

  section {
    scroll-snap-align: start;
    position: relative; height: 100vh; overflow: hidden;
    background-color: #0a0a0a;
    background-size: contain; background-position: center; background-repeat: no-repeat;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 60px 40px;
  }
  section::after {
    content: ''; position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.15) 0%, rgba(0,0,0,.6) 100%);
  }
  section > * { position: relative; z-index: 10; }

  /* Photo assignments */
  .sec-hero    { background-image: url('橘子洲的照片/航拍图.webp'); }
  .sec-poem1   { background-image: url('橘子洲的照片/毛主席雕像1.jpg'); }
  .sec-poem2   { background-image: url('橘子洲的照片/秋景.webp'); }
  .sec-info    { background-image: url('橘子洲的照片/林荫道.webp'); }
  .sec-spots   { background-image: url('橘子洲的照片/faPxuQqZB.jpeg'); }
  .sec-night   { background-image: url('橘子洲的照片/烟花秀1.jpeg'); }
  .sec-food    { background-image: url('橘子洲的照片/美食拼图.png'); }
  .sec-footer  { background-image: url('橘子洲的照片/艺术照.webp'); }

  /* ===== HERO ===== */
  .hero-title {
    font-size: 100px; letter-spacing: 30px; line-height: 1; color: #fff;
    text-shadow: 0 4px 50px rgba(0,0,0,.8), 0 2px 20px rgba(255,160,40,.5);
  }
  .hero-sub { font-size: 14px; letter-spacing: 16px; color: rgba(255,255,255,.7); margin-top: 20px; text-shadow: 0 1px 8px rgba(0,0,0,.8); }

  /* ===== POEM ===== */
  .poem-label { font-size: 15px; letter-spacing: 12px; color: rgba(255,255,255,.6); margin-bottom: 30px; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
  .poem-text { font-size: 36px; letter-spacing: 8px; line-height: 2.1; color: #fff; text-shadow: 0 3px 24px rgba(0,0,0,.9); }
  .poem-text em { font-style: normal; color: #ffc870; text-shadow: 0 0 20px rgba(255,180,80,.6); }
  .poem-text .gold { color: #ffe0a0; text-shadow: 0 0 16px rgba(255,200,100,.5); }
  .poem-muted { font-size: 22px; color: rgba(255,255,255,.65); margin-top: 20px; font-family: 'Liu Jian Mao Cao',cursive; text-shadow: 0 2px 16px rgba(0,0,0,.9); }

  /* ===== INFO ===== */
  .sec-info { gap: 24px; }
  .info-title { font-size: 38px; letter-spacing: 10px; line-height: 1.5; color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,.9); }
  .info-title em { font-style: normal; color: #ffc870; text-shadow: 0 0 20px rgba(255,180,80,.5); }
  .info-body { font-size: 15px; line-height: 2.2; letter-spacing: 3px; max-width: 520px; color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(0,0,0,.9); }
  .info-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; width: 100%; max-width: 560px; }
  .info-tag { background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 14px 8px; }
  .info-tag .icon { font-size: 22px; margin-bottom: 4px; }
  .info-tag .lbl { font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,.5); }
  .info-tag .val { font-size: 13px; letter-spacing: 2px; color: #fff; margin-top: 2px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }

  /* ===== SPOTS ===== */
  .sec-spots { gap: 26px; }
  .spots-title { font-size: 32px; letter-spacing: 12px; color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,.9); }
  .spots-title em { font-style: normal; color: #ffc870; text-shadow: 0 0 20px rgba(255,180,80,.5); }
  .spots-list { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 540px; }
  .spot-row { display: flex; align-items: flex-start; gap: 14px; text-align: left; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 16px 20px; }
  .spot-row .num { flex-shrink: 0; font-size: 32px; font-weight: 900; color: rgba(255,180,100,.35); line-height: 1; width: 36px; }
  .spot-row h4 { font-size: 18px; letter-spacing: 4px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  .spot-row p { font-size: 13px; line-height: 1.7; letter-spacing: 2px; color: rgba(255,255,255,.7); text-shadow: 0 1px 4px rgba(0,0,0,.6); }

  /* ===== NIGHT ===== */
  .sec-night { gap: 18px; }
  .night-title { font-size: 48px; letter-spacing: 16px; color: #fff; text-shadow: 0 0 60px rgba(255,200,80,.6), 0 4px 30px rgba(0,0,0,.9); }
  .night-sub { font-size: 18px; letter-spacing: 10px; color: rgba(255,255,255,.7); text-shadow: 0 2px 12px rgba(0,0,0,.9); }
  .night-tag { padding: 16px 32px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; font-size: 15px; letter-spacing: 4px; color: rgba(255,255,255,.75); text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .night-tag strong { color: #ffd080; font-size: 17px; }

  /* ===== FOOD ===== */
  .sec-food { gap: 28px; }
  .food-title { font-size: 30px; letter-spacing: 12px; color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,.9); }
  .food-title em { font-style: normal; color: #ffc870; text-shadow: 0 0 20px rgba(255,180,80,.5); }
  .food-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 540px; }
  .food-item { background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 18px 10px; }
  .food-item .emoji { font-size: 28px; margin-bottom: 4px; }
  .food-item h5 { font-size: 17px; letter-spacing: 3px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .food-item .rec { font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,.55); text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .food-item .rec span { color: #ffc870; font-weight: 500; }

  /* ===== FOOTER ===== */
  .sec-footer { background-size: contain; }
  .footer-title { font-size: 44px; letter-spacing: 16px; line-height: 1.9; color: #fff; text-shadow: 0 3px 30px rgba(0,0,0,.9); }
  .footer-title b { color: #ffc870; text-shadow: 0 0 30px rgba(255,180,80,.5); }
  .footer-addr { font-size: 13px; letter-spacing: 6px; color: rgba(255,255,255,.5); text-shadow: 0 1px 8px rgba(0,0,0,.8); margin-top: 28px; }

  /* ===== WATERMARK ===== */
  section .watermark {
    position: absolute !important; bottom: 28px; right: 28px; z-index: 9999 !important;
    font-size: 18px; letter-spacing: 6px; font-family: 'Noto Sans SC', sans-serif;
    color: #fff; font-weight: 500;
    padding: 4px 12px;
    background: rgba(0,0,0,.45);
    border-radius: 4px;
  }

  /* ===== MUSIC BUTTON ===== */
  .music-btn {
    position: fixed; bottom: 30px; right: 30px; z-index: 9999;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.15);
    color: #fff; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .3s;
  }
  .music-btn:hover { background: rgba(0,0,0,.75); }
  .music-btn.off { color: rgba(255,255,255,.3); }

  /* ===== REVEAL ===== */
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.on { opacity: 1; transform: translateY(0); }

  @media (max-width: 600px) {
    .hero-title { font-size: 56px; letter-spacing: 14px; }
    .poem-text { font-size: 24px; letter-spacing: 4px; }
    .info-grid { grid-template-columns: repeat(3, 1fr); }
    .night-title { font-size: 34px; letter-spacing: 8px; }
    .footer-title { font-size: 28px; letter-spacing: 8px; }
    .food-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

  <div class="hero-title reveal" style="font-family:'Liu Jian Mao Cao',KaiTi,STKaiti,cursive;font-size:100px;letter-spacing:30px;">橘子洲</div>

</section>

<section class="sec-poem1"><div class="bg-main"></div><div class="bg-overlay"></div><div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;text-align:center;background:rgba(20,15,10,0.35);padding:8px 20px;border-radius:6px;"><span style="font-family:'Liu Jian Mao Cao',KaiTi,STKaiti,cursive;font-size:16px;color:rgba(240,225,200,0.85);letter-spacing:4px;line-height:1.8;">怅寥廓，问苍茫大地，谁主沉浮？</span><br><span style="font-family:'Liu Jian Mao Cao',KaiTi,STKaiti,cursive;font-size:11px;color:rgba(220,210,190,0.55);letter-spacing:2px;">——毛泽东</span></div><div style="position:absolute;bottom:28px;right:28px;z-index:99999;font-size:18px;letter-spacing:6px;color:#fff;font-weight:500;padding:4px 12px;background:rgba(0,0,0,.5);border-radius:4px;font-family:Arial,sans-serif;">Zcl</div></section>

<!-- ③ 下阕 -->
<section class="sec-poem2"><div class="bg-main"></div><div class="bg-overlay"></div><div style="position:absolute;bottom:50px;left:calc(50% - 200px);z-index:20;max-width:340px;background:rgba(30,20,10,0.3);padding:8px 14px;border-radius:6px;"><span style="font-family:KaiTi,STKaiti,FangSong,cursive;font-size:18px;color:rgba(245,238,220,0.85);letter-spacing:3px;line-height:1.5;">来橘子洲<br>吹湘江风<br>追五星光<br>把青春写进山水诗行</span></div><div style="position:absolute;bottom:28px;right:28px;z-index:99999;font-size:18px;letter-spacing:6px;color:#fff;font-weight:500;padding:4px 12px;background:rgba(0,0,0,.5);border-radius:4px;font-family:Arial,sans-serif;">Zcl</div></section>

<!-- ④ 景区速览 -->
<section class="sec-info"><div class="bg-main"></div><div class="bg-overlay"></div><div style="position:absolute;bottom:40px;left:calc(50% - 250px);z-index:20;max-width:500px;background:rgba(25,18,10,0.38);padding:10px 16px;border-radius:6px;"><span style="font-family:KaiTi,STKaiti,FangSong,cursive;font-size:14px;color:rgba(242,235,218,0.85);letter-spacing:3px;line-height:1.9;">观光小火车 ￥40 · 环岛全程<br>橘子洲码头游船 ￥80起 · 湘江游览<br>橘洲沙滩公园 ￥30 · 运动休闲</span></div><div style="position:absolute;bottom:28px;right:28px;z-index:99999;font-size:18px;letter-spacing:6px;color:#fff;font-weight:500;padding:4px 12px;background:rgba(0,0,0,.5);border-radius:4px;font-family:Arial,sans-serif;">Zcl</div></section>

<!-- ⑤ 打卡点位 -->

<audio id="bgm" loop autoplay muted playsinline>
  <source src="橘子洲的照片/音乐1.mp3" type="audio/mpeg">
</audio>
<button class="music-btn playing" id="musicBtn" title="音乐 开/关">&#9835;</button>

<script>
(function(){
  // Fade-in
  var obs = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('on'); });
  }, {threshold: .12});
  document.querySelectorAll('.reveal').forEach(function(el){ obs.observe(el); });

  // Music — autoplay with unmute on first interaction
  var audio = document.getElementById('bgm');
  var btn = document.getElementById('musicBtn');
  var started = false;
  audio.volume = 0.6;
  // Try autoplay (may work if muted)
  audio.play().then(function(){
    btn.classList.add('playing');
    if(!started){ audio.muted=false; started=true; }
  }).catch(function(){
    btn.classList.add('off');
  });
  btn.addEventListener('click', function(){
    if (audio.paused) {
      audio.muted=false; audio.play(); btn.classList.remove('off');
    } else {
      audio.pause(); btn.classList.add('off');
    }
  });
  // Unmute on any user interaction
  document.addEventListener('click', function once(){
    if(!started){ audio.muted=false; audio.play(); btn.classList.remove('off'); started=true; }
  }, { once: true });
  document.addEventListener('scroll', function once(){
    if(!started){ audio.muted=false; audio.play(); btn.classList.remove('off'); started=true; }
  }, { once: true });

  // Auto-scroll
  var sections = document.querySelectorAll('section');
  var current = 0, autoTimer, userScrolling = false, scrollTimeout;

  function scrollTo(idx) {
    if (idx < 0 || idx >= sections.length) return;
    current = idx;
    var start = window.pageYOffset;
    var end = sections[current].getBoundingClientRect().top + start;
    var dist = end - start, duration = 3500, startTime = null;

    function step(ts) {
      if (!startTime) startTime = ts;
      var p = Math.min((ts - startTime) / duration, 1);
      window.scrollTo(0, start + dist * Math.sin(p * Math.PI / 2));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  autoTimer = setInterval(function() {
    if (!userScrolling) { current = (current + 1) % sections.length; scrollTo(current); }
  }, 4000);

  window.addEventListener('wheel', function() {
    userScrolling = true;
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(function() {
      userScrolling = false;
      // Snap to nearest section
      var best = 0, bestDist = Infinity;
      sections.forEach(function(s, i) {
        var d = Math.abs(s.getBoundingClientRect().top);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      current = best;
      scrollTo(current);
    }, 2000);
  }, { passive: true });

  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); scrollTo(current + 1); }
    if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); scrollTo(current - 1); }
  });
})();
</script>
</body>
